name: Daily AI News Digest

on:
  schedule:
    # 每天北京时间 6:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD), 留空使用当天'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate AI News Digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node .github/workflows/generate-news.js

      - name: Commit and push new content
        run: |
          git config user.name "BestBlogs AI Bot"
          git config user.email "ai-bot@bestblogs.dev"

          git add _posts/

          if git diff --cached --quiet; then
            echo "No new content to commit."
          else
            git commit -m "🤖 [AI] 每日早报 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
            echo "✅ New content committed and pushed."
          fi
