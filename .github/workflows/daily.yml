name: Daily AI News Digest

on:
  schedule:
    # 每天北京时间 6:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD), 留空使用当天'
        required: false
        default: ''

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate AI News Digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          node .github/workflows/generate-news.js

      - name: Build Jekyll site
        run: |
          gem install bundler
          bundle install
          bundle exec jekyll build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Commit and push generated content
        run: |
          git config user.name "BestBlogs AI Bot"
          git config user.email "ai-bot@bestblogs.dev"

          # Check if there are new posts
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new content to commit."
          else
            git add _posts/ index.md
            git commit -m "🤖 [AI] 每日早报 $(date +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: generate-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
